<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- tomoya-bouken（GitHub Pages で公開） -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#17283c">
<title>大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17283c;color:#fff;font-family:system-ui;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
canvas{display:block;background:#17283c}
.controls{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pad{display:flex;gap:14px;align-items:center}
/* ===== 操作ボタン：金のふち・つやのある立体ボタン ===== */
#dpad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:5px;padding:6px;width:200px;height:120px;border-radius:30px;
  background:linear-gradient(#33466e,#121c33);border:3px solid #ffd45a;box-shadow:0 0 0 2px #7a5a10,0 6px 0 #0006,0 10px 18px #0008,inset 0 2px 0 #ffffff30;touch-action:none}
#dpad span{position:relative;display:grid;place-items:center;font-size:44px;color:#fff;pointer-events:none;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 12%,#8fd8ff 0%,#3a92e6 42%,#17488f 100%);text-shadow:0 2px 0 #0b2a5a,0 0 10px #bfe6ff;
  box-shadow:inset 0 3px 0 #ffffff88,inset 0 -6px 8px #0005;transition:transform .06s}
#dpad span::after{content:'';position:absolute;left:12%;top:6%;width:76%;height:30%;border-radius:50%;background:linear-gradient(#ffffffb0,#fff0)}
#dpad span.on{background:radial-gradient(120% 95% at 50% 12%,#fff6b0 0%,#ffd23a 45%,#c98a00 100%);color:#5a3200;text-shadow:0 1px 0 #fff8;
  box-shadow:0 0 18px #ffdf50,inset 0 3px 0 #fff9,inset 0 -6px 8px #0003;transform:scale(.95)}
.btn{position:relative;overflow:hidden;width:84px;height:84px;border-radius:50%;border:3px solid #ffd45a;color:#fff;font:800 14px system-ui;display:grid;place-content:center;line-height:1.15;touch-action:none;padding:0;
  text-shadow:0 2px 0 #0007;box-shadow:0 0 0 2px #7a5a10,0 6px 0 #0006,0 10px 18px #0008,inset 0 3px 0 #ffffff70,inset 0 -8px 12px #0005;transition:transform .06s,filter .06s}
.btn::after{content:'';position:absolute;left:18%;top:7%;width:64%;height:34%;border-radius:50%;background:linear-gradient(#ffffffb8,#fff0);pointer-events:none}
.btn b{font-size:28px;display:block;filter:drop-shadow(0 2px 0 #0006)}
#jump{background:radial-gradient(circle at 50% 28%,#ffb0b0 0%,#ff4a5a 40%,#a80e26 100%)}   /* ジャンプ：赤 */
#dig{background:radial-gradient(circle at 50% 28%,#a8f5b4 0%,#34b85c 42%,#11602d 100%)}    /* 掘る：緑 */
.btn.on{transform:scale(.92) translateY(2px);filter:brightness(1.2);box-shadow:0 0 0 2px #7a5a10,0 0 22px #ffdf50,inset 0 3px 0 #ffffff70,inset 0 -4px 8px #0004}
#jump{width:100px;height:100px}
.topbtns{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);display:flex;gap:8px;z-index:5}
.topbtns button{width:44px;height:44px;border-radius:12px;border:2px solid #ffd45a99;background:linear-gradient(#3a5078,#18243c);color:#fff;font-size:22px;padding:0;touch-action:none;box-shadow:0 3px 0 #0006,inset 0 2px 0 #ffffff30}
#music.off{opacity:.6}
/* BGMの切りかえ：2つのうち、いま流れている方が黄色く光る。押した方に切りかわる */
#bgmSwitch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px 6px 6px;border-radius:14px;background:rgba(23,40,60,.88);border:2px solid #ffdf50;box-shadow:0 0 14px #ffdf5066;color:#fff}
#bgmSwitch span{grid-column:1/-1;text-align:center;font:900 16px system-ui;color:#ffdf50;line-height:1.25;letter-spacing:.04em}
.topbtns #bgmSwitch button{width:auto;height:44px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.14);border:1.5px solid #ffffff66;color:#fff;font:800 16px system-ui;touch-action:manipulation;white-space:nowrap}
.topbtns #bgmSwitch button[aria-pressed="true"]{background:linear-gradient(#fff6b0,#ffd23a 50%,#e0a010);border-color:#fff;color:#3a2000;box-shadow:0 3px 0 #9a6a10,0 0 12px #ffdf5088,inset 0 2px 0 #fff9}
.topbtns #bgmSwitch button[aria-pressed="true"]::before{content:'✓ '}
.topbtns #bgmSwitch button:focus-visible{outline:3px solid #fff;outline-offset:1px}
/* ===== STARTボタン：虹色に回る光のふち＋金のボタン＋紺の再生マーク ===== */
#startBtn{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:6;overflow:hidden;padding:4px;border:0;border-radius:999px;background:#1a0f00;
  box-shadow:0 0 0 2px #3a2200,0 8px 0 #4a2a00,0 0 34px #ffcf4a99,0 16px 28px #0008;touch-action:manipulation;animation:pulse 1.4s ease-in-out infinite;cursor:pointer}
#startBtn::before{content:'';position:absolute;left:50%;top:50%;width:200%;aspect-ratio:1;translate:-50% -50%;
  background:conic-gradient(#fff6b0,#ffb020,#ff5a8a,#b07aff,#5fd0ff,#7dffb0,#fff6b0);animation:startSpin 2.6s linear infinite}   /* 回る虹色のふち */
@keyframes startSpin{to{rotate:360deg}}
#startBtn .sb-body{position:relative;z-index:1;display:flex;align-items:center;gap:12px;overflow:hidden;padding:8px 30px 8px 10px;border-radius:999px;
  background:linear-gradient(#fffbe0 0%,#ffe066 30%,#ffb81e 62%,#e08a00 100%);box-shadow:inset 0 3px 0 #ffffffd0,inset 0 -5px 8px #a85a0088}
#startBtn .sb-body::after{content:'';position:absolute;top:-30%;left:-40%;width:28%;height:160%;background:linear-gradient(90deg,#fff0,#ffffffd8,#fff0);transform:skewX(-20deg);animation:startShine 2.4s ease-in-out infinite}   /* 光が流れる */
#startBtn .sb-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4a5a9a,#1a2250 70%);
  border:2px solid #fff3b0;box-shadow:0 2px 0 #7a4a00,inset 0 2px 0 #ffffff40;color:#ffd84a;font-size:20px;padding-left:3px;text-shadow:0 0 8px #ffd84a}
#startBtn .sb-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1;color:#3a1a00;font:900 30px system-ui;letter-spacing:4px;text-shadow:0 2px 0 #fff8,0 -1px 0 #7a4a0055}
#startBtn .sb-tx small{font:800 11px system-ui;letter-spacing:3px;margin-top:4px;color:#7a3a00;text-shadow:none}
@keyframes startShine{0%,55%{left:-40%}100%{left:130%}}
#startBtn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 0 0 2px #3a2200,0 3px 0 #4a2a00,0 0 24px #ffcf4a99}
#startBtn:active .sb-body{filter:brightness(1.08)}
@keyframes pulse{50%{scale:1.06}}
@media (prefers-reduced-motion:reduce){#startBtn,#startBtn::before,#startBtn .sb-body::after{animation:none}}
#fs{display:none}
.hint,.help{font-size:13px;opacity:.8;text-align:center;margin:8px 0 0}
.help{display:none}
@media (orientation:landscape){
  /* 左：方向パッド ／ 中央：ゲーム画面 ／ 右：掘る・ジャンプ（重ならない） */
  #stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);align-items:center;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #stage > canvas{grid-column:2;grid-row:1;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
  .controls{display:contents}
  .pad{grid-row:1;padding:0 10px}
  .controls .pad:first-child{grid-column:1}
  .controls .pad:last-child{grid-column:3;flex-direction:column-reverse;gap:12px;align-self:end;padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}   /* 上：ジャンプ　下：掘る（親指がとどきやすいよう下寄せ） */
  #dpad{width:min(170px,20vw);height:min(150px,40vh)}
  #dpad span{font-size:min(44px,6vw,11vh)}
  .btn{width:min(80px,10vw,22vh);height:min(80px,10vw,22vh)}
  #jump{width:min(94px,12vw,26vh);height:min(94px,12vw,26vh)}
  .hint{display:none}
  .topbtns{left:calc(env(safe-area-inset-left) + 8px);right:auto;width:min(160px,19vw);flex-wrap:wrap;justify-content:center;gap:6px}   /* 横画面：左上（方向パッドの上）に置いて、ゲーム画面にかぶらない */
  .topbtns #music,.topbtns #fs{position:fixed;top:calc(env(safe-area-inset-top) + 6px);z-index:6;width:40px;height:40px;font-size:20px}   /* 横画面：🎵と全画面は右上へ（◀▶ボタンにかぶらない） */
  .topbtns #music{right:calc(env(safe-area-inset-right) + 6px)}
  .topbtns #fs{right:calc(env(safe-area-inset-right) + 50px)}
  .topbtns #bgmSwitch{width:100%;grid-template-columns:1fr}   /* 横画面：2つを縦に並べて、文字を大きく */
  .topbtns #bgmSwitch span{font-size:clamp(10px,1.8vw,16px)}
  .topbtns #bgmSwitch button{height:clamp(34px,10vh,44px);padding:0 2px;font-size:clamp(10px,2vw,16px)}
  .controls .pad:first-child{align-self:end;padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}   /* 方向パッドは下へ寄せて、BGMボタンと重ならない */
  .help{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);margin:0}
}
@media (orientation:landscape) and (max-width:620px){
  .topbtns #fs{right:calc(env(safe-area-inset-right) + 6px);top:calc(env(safe-area-inset-top) + 50px)}   /* 右のすきまがせまい画面では、全画面ボタンは🎵の下に */
}
@media (orientation:portrait){
  #stage > canvas{width:100%;height:auto;aspect-ratio:16/9;margin-top:env(safe-area-inset-top)}
  .controls{flex:1;align-items:center;gap:8px;padding:16px 12px calc(env(safe-area-inset-bottom) + 20px)}
  .pad{gap:10px}
  #dpad{width:min(210px,42vw);height:min(130px,28vw)}
  .topbtns{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;justify-content:center;align-items:center}   /* はみ出さないよう画面の幅に収める */
  .topbtns #bgmSwitch button{font-size:min(16px,4vw);padding:0 min(10px,1.5vw)}
  .topbtns #bgmSwitch span{font-size:min(16px,4vw)}
  #startBtn{top:calc(env(safe-area-inset-top) + 56.25vw*.6 - 26px)}
  #startBtn .sb-body{padding:5px 20px 5px 6px;gap:8px}#startBtn .sb-ic{width:34px;height:34px;font-size:16px}#startBtn .sb-tx{font-size:22px;letter-spacing:3px}#startBtn .sb-tx small{font-size:9px}
  .btn{width:min(92px,21vw);height:min(92px,21vw)}#jump{width:min(110px,25vw);height:min(110px,25vw)}
}
@media (hover:hover) and (pointer:fine){.help{display:block}.hint{display:none}}
#arcade{box-sizing:border-box;width:min(560px,94vw);max-height:92dvh;overflow:auto;border:2px solid #79a7cb;border-radius:16px;padding:16px;background:#17283c;color:#fff;text-align:center;touch-action:pan-y}
#arcade::backdrop{background:#071322c9}
#arcade h2,#arcade h3{margin:0 0 8px}
#arcade p{margin:8px 0}
#arcade button{border:0;border-radius:8px;padding:8px 13px;margin:3px;background:#e9f0ff;color:#17283c;font:700 15px system-ui;cursor:pointer;touch-action:manipulation;min-height:36px}
#arcade button:disabled{opacity:.5}
#arcade canvas{display:block;background:#102035;margin:6px auto;max-width:100%;height:auto;object-fit:contain}
#arcade.maze-open{width:min(1120px,97vw);max-height:97dvh;padding:12px}
#arcade.maze-open .arcadeHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
#arcade.maze-open .arcadeHeader h2{margin:0;font-size:clamp(16px,3vw,23px)}
#mazeLayout{display:grid;justify-items:center;align-items:center;gap:8px}
#mazeBoard{width:100%;margin:0!important;image-rendering:pixelated}
#mazeControls{display:grid;justify-items:center;gap:4px}
#mazeDirections{display:grid;grid-template-columns:repeat(3,minmax(32px,50px));grid-template-rows:repeat(3,minmax(32px,50px));gap:3px;touch-action:none}
#arcade #mazeDirections button{margin:0;min-height:0;padding:0;font-size:23px;touch-action:none}
#mazeDirections [data-dir="up"]{grid-area:1/2}
#mazeDirections [data-dir="left"]{grid-area:2/1}
#mazeDirections [data-dir="right"]{grid-area:2/3}
#mazeDirections [data-dir="down"]{grid-area:3/2}
#arcade #mazeDirections button.held{background:#ffdf50}
@media (orientation:landscape){
  #mazeLayout{grid-template-columns:clamp(112px,22vw,174px) minmax(0,1fr)}
  #mazeControls{grid-area:1/1}
  #mazeBoard{grid-area:1/2}
  #mazeBoard{width:min(100%,calc((100dvh - 117px)*1.44))}
}
@media (orientation:portrait){
  #mazeControls{justify-self:start;grid-template-columns:auto auto;align-items:center;gap:3px 14px}
  #mazeDirections{grid-row:1/3;grid-column:1}
  #mazeStatus{grid-column:2}
}
#slotBoard{width:min(330px,100%)}
#slotPlay{position:relative}
#slotPlay.reach #slotBoard{animation:slotReach .25s steps(2) infinite}
@keyframes slotReach{50%{box-shadow:0 0 0 4px #ff5d8f,0 0 18px #ff5d8f}}
.slotConfetti{position:absolute;top:30%;left:50%;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:slotConfetti 1.6s ease-out forwards}
@keyframes slotConfetti{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){#slotPlay.reach #slotBoard{animation:none;box-shadow:0 0 0 4px #ff5d8f}.slotConfetti{display:none}}
#slotPayout{margin:8px auto;width:min(310px,100%);color:#ffe384;font:800 18px system-ui}
#slotPayout progress{display:block;width:100%;height:12px;margin-top:5px;accent-color:#ffd74b}
#slotPayoutCount{font-variant-numeric:tabular-nums}
.arcadeStatus{min-height:1.5em;color:#ffdf70}
#slotRank{margin:6px auto;min-height:1.3em;font:900 clamp(28px,7vw,40px)/1.3 system-ui;letter-spacing:.04em}
#slotRank.rank1{color:#ffd84a;text-shadow:0 0 12px #ffae00}
#slotRank.rank2{color:#ff9fd0}
#slotRank.rank3{color:#8fe8ff}
#slotRank.rank4{color:#b6f29a}
#slotRank.miss{color:#9fb3c8}
#slotPrizes{margin:6px auto;border-collapse:collapse;font-size:14px}
#slotPrizes td{padding:2px 8px;border-radius:6px}
#slotPrizes tr.hit td{background:#ffd84a;color:#17283c;font-weight:900}
/* 横画面：スロットは「当たり表」と「リール・まわすボタン」を左右に並べて、縦にはみ出さないようにする */
@media (orientation:landscape) and (max-height:640px){
  #arcade.slots-open{width:min(820px,97vw);max-height:97dvh;padding:10px 14px}
  #arcade.slots-open .arcadeHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  #arcade.slots-open .arcadeHeader h2{margin:0;font-size:clamp(16px,3vw,22px)}
  #slotsPanel:not([hidden]){display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
  #slotPrizes{font-size:13px}
  #slotBoard{width:min(330px,100%,calc((100dvh - 190px)*3.17))}
  #slotRank{margin:2px auto;font-size:clamp(22px,5dvh,32px)}
  #slotPayout{margin:2px auto;font-size:15px}
  #arcade #slotSpin{min-height:40px;padding:6px 28px;font-size:17px}
}
@media (max-height:450px) and (orientation:landscape){
  #arcade{padding:8px}
  #arcade h2,#arcade h3{font-size:16px;margin:0}
  #arcade p{margin:3px 0}
  #mazeBoard{width:min(100%,calc((100dvh - 88px)*1.44))}
  #mazeDirections{grid-template-columns:repeat(3,minmax(32px,12dvh));grid-template-rows:repeat(3,minmax(32px,12dvh))}
  #arcade button{min-height:30px;padding:4px 10px}
}
</style></head><body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<p class="hint">📱 横向きにすると大きく遊べます</p>
<div class="controls">
  <div class="pad"><div id="dpad"><span>◀</span><span>▶</span></div></div>
  <div class="pad"><button class="btn" id="dig"><b>⛏</b>掘る</button><button class="btn" id="jump"><b>⬆</b>ジャンプ</button></div>
</div>
<p class="help">← → / A D 移動・スペースでジャンプ（移動キーと同時押しで斜めジャンプ）・X で穴掘り・M で音楽ON/OFF・R でやり直し</p>
<button id="startBtn" aria-label="ゲームスタート"><span class="sb-body"><span class="sb-ic" aria-hidden="true">▶</span><span class="sb-tx">START<small>ゲームスタート</small></span></span></button>
<div class="topbtns"><div id="bgmSwitch" role="group" aria-label="BGMの種類"><span>♫ BGMをえらぶ</span><button type="button" data-bgm="chip" aria-pressed="true" title="ピコピコ音のレトロなBGM">ファミコン風</button><button type="button" data-bgm="mp3" aria-pressed="false" title="楽器の音で作った豪華なBGM">本格サウンド</button></div><button id="music" aria-label="音楽">🎵</button><button id="fs" aria-label="全画面">⛶</button></div>
</div>
<dialog id="arcade" aria-labelledby="arcadeTitle">
  <div class="arcadeHeader">
    <h2 id="arcadeTitle">はしごの先のあそび場</h2>
    <button id="arcadeExit" type="button">地上へ戻る</button>
  </div>
  <section id="mazePanel" hidden>
    <div id="mazeLayout">
      <canvas id="mazeBoard" width="416" height="288" aria-label="迷路"></canvas>
      <div id="mazeControls">
        <div id="mazeDirections" aria-label="方向ボタン">
          <button type="button" data-dir="up" aria-label="上">↑</button>
          <button type="button" data-dir="left" aria-label="左">←</button>
          <button type="button" data-dir="right" aria-label="右">→</button>
          <button type="button" data-dir="down" aria-label="下">↓</button>
        </div>
        <p id="mazeStatus" class="arcadeStatus" role="status"></p>
      </div>
    </div>
  </section>
  <section id="slotsPanel" hidden>
   <div id="slotInfo">
    <h3>よし太くんスロット</h3>
    <table id="slotPrizes">
      <tr data-rank="1"><td>1等</td><td>よし太くん 3つ</td><td>50枚</td></tr>
      <tr data-rank="2"><td>2等</td><td>ほかの絵柄 3つ</td><td>25枚</td></tr>
      <tr data-rank="3"><td>3等</td><td>よし太くん 2つ</td><td>10枚</td></tr>
      <tr data-rank="4"><td>4等</td><td>ほかの絵柄 2つ</td><td>5枚</td></tr>
    </table>
    <p>まわせるのは1回だけ！</p>
   </div>
   <div id="slotPlay">
    <canvas id="slotBoard" width="330" height="104" aria-label="スロットの絵柄"></canvas>
    <button id="slotSpin" type="button">まわす</button>
    <p id="slotRank" aria-live="polite"></p>
    <p id="slotStatus" class="arcadeStatus" role="status"></p>
    <div id="slotPayout" hidden aria-hidden="true">
      <span id="slotPayoutCount"></span>
      <progress id="slotPayoutMeter" value="0" max="1"></progress>
    </div>
   </div>
  </section>
</dialog>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),W=960,H=540,ground=465;
let world=4300,stage=1,AX=0,arenaOn=false,boss=null,rocks=[],waves=[],parts=[],shake=0,bannerText='',bannerSub='',bannerT=0,clearT=0,endT=0,stageStartScore=0;
let keys={},player,coins=[],enemies=[],platforms=[],camera=0,score=0,state='play',goalTick=0,audioCtx,deathTick=0,lives=3,holes=[],digCooldown=0,digHold=false,padJump=false,bgmStep=0,curSong=null,digBuf=0,digBufT=0,failMark=null,items=[],popups=[],spots=[];
const STARS=Array.from({length:90},(_,i)=>({x:(i*397)%W,y:(i*173)%380,s:1+(i%3),p:i}));

function makeEnemy(x0,type,i,perch){return {x:x0,y:perch?perch.y-32:ground-32,w:32,h:32,alive:true,dir:i%2?1:-1,vy:0,spawnX:x0,respawns:0,type,speed:type==='hop'?1.3:type==='boar'?.9:.7,hopT:40+i*7,grounded:true,home:perch?null:x0,range:240,perchT:perch?240+Math.floor(Math.random()*240):0}}
function boarSpeed(e,p){
  if(!e.grounded||e.kick>0){
    e.windup=0;e.charge=0;
    return e.speed;
  }
  if(e.windup||e.charge){
    e.dir=e.chargeDir;
    if(!onSurface(e.x+(e.dir>0?e.w+8:-8),e.y+e.h)){
      e.windup=0;e.charge=0;e.recover=45;
      return 0;
    }
    if(e.windup){
      if(--e.windup===0)e.charge=60;
      return 0;
    }
    if(--e.charge===0)e.recover=55;
    return 5.8;
  }
  if(e.recover>0){
    e.recover--;
    return e.speed;
  }
  if(e.chasing&&Math.abs(p.x+p.w/2-e.x-e.w/2)<=245){
    e.windup=34;e.chargeDir=e.dir;
    return 0;
  }
  return e.speed*(e.chasing?1.45:1);
}

function drawHole(h,depth){
  const L=h.x,R=h.x+h.w,T=h.y,dusk=stage===2;
  // 掘り出した土の山（掘るほど大きくなる）
  const pile=Math.min(3,h.stage)*3.2;
  for(const [px,dir] of[[L-8,-1],[R+8,1]]){ell(px,T-1,10+pile,3+pile*.8,dusk?'#6a4630':'#8a5a32');ell(px-dir*2,T-2-pile*.5,6+pile*.6,2+pile*.5,dusk?'#8a6040':'#a8703e');
    for(let k=0;k<3;k++)ell(px+dir*(6+k*5),T-1-((k*7)%3),1.8,1.4,dusk?'#5a3a28':'#6e4426');}
  // 中：上は土の色、奥ほど暗い
  const g=x.createLinearGradient(0,T,0,T+depth);g.addColorStop(0,'#4a2e1e');g.addColorStop(.35,'#2a1a12');g.addColorStop(1,'#0e0806');
  x.fillStyle=g;x.fillRect(L,T,h.w,depth);
  // 左右の壁（土の層・石・根っこ）
  for(const [wx,dir] of[[L,1],[R,-1]]){const wg=x.createLinearGradient(wx,0,wx+dir*9,0);wg.addColorStop(0,'#7a4e2e');wg.addColorStop(1,'#3a2416');
    x.fillStyle=wg;x.fillRect(dir>0?wx:wx-9,T,9,depth);
    for(let yy=T+8;yy<T+depth-4;yy+=11)ell(wx+dir*(3+((yy*7)%4)),yy,2.2,1.6,'#9a8a7a88');}
  x.strokeStyle='#5a3a22';x.lineWidth=1.5;x.lineCap='round';
  if(depth>16){x.beginPath();x.moveTo(L+2,T+8);x.quadraticCurveTo(L+12,T+14,L+9,T+22);x.moveTo(R-2,T+12);x.quadraticCurveTo(R-11,T+17,R-7,T+26);x.stroke();}   // 根っこ
  // 底の土
  x.fillStyle='#5a3a24';x.fillRect(L,T+depth-5,h.w,5);x.fillStyle='#7a5234';x.fillRect(L+4,T+depth-5,h.w-8,2);
  // ふちの土の切り口と、たれ下がる草
  x.fillStyle='#8a5a32';x.fillRect(L-1,T,h.w+2,3);
  x.fillStyle=dusk?'#5a9a4a':'#4fb850';
  for(const [ex,dir] of[[L,1],[R,-1]]){x.beginPath();x.moveTo(ex-dir*2,T);x.lineTo(ex+dir*5,T+6);x.lineTo(ex+dir*3,T);x.lineTo(ex+dir*9,T+4);x.lineTo(ex+dir*7,T);x.closePath();x.fill();}
}

function mp3Get(key){if(key in mp3)return mp3[key];const cfg=MP3_BGM[key];if(!cfg)return mp3[key]=null;
  const m=mp3[key]={cfg,el:null,elBad:false,buf:null,bufBad:false,loading:false,engine:mp3UseWebAudio?'buf':'el',src:null,gain:null,pos:0,lastCtxT:0,reqT:0,elT0:0,elOK:false};

   .then(b=>{m.buf=b}).catch(()=>{m.bufBad=true}).finally(()=>{m.loading=false})}

function mp3Tick(){   // MP3の再生開始を確認してから通常BGMを止める。読み込み中は通常BGMを継続。
  const s=currentSong(),want=(!paused&&musicOn&&!document.hidden&&mode==='game'&&audioCtx)?mp3Key(s):null;
  if(want!==mp3Cur){if(mp3Cur)mp3Halt(mp3Cur);mp3Cur=want;if(want){const m=mp3Get(want);if(m){m.started=false;}}}
  if(!want)return false;const m=mp3Get(want);if(!m)return false;
  mp3Load(m);
  const rate=Math.max(.5,Math.min(3,BASE_DUR[s]?BASE_DUR[s]/SONGS[s].dur():1));

    if(m.elBad||(!m.elOK&&m.reqT&&Date.now()-m.reqT>1200)){if(m.el){try{m.pos=m.el.currentTime;m.el.pause()}catch(_){}}m.engine='buf';}

    return true}

function bgmTick(){
  const s=currentSong();
  if(mp3Enabled&&mode==='game'&&musicOn&&!paused&&!document.hidden){
    // クリア画面とボス登場演出の間に、次の場面のアレンジ曲を先読みする。
    const upcoming=state==='clear'?'field2':bossIntroLong()?'boss':null;
    if(upcoming)mp3Load(mp3Get(upcoming));
  }
  const playingArrangement=mp3Tick();
  const waitForArrangement=mp3Enabled&&(s==='field2'||s==='boss'||state==='ending');
  if(playingArrangement||waitForArrangement){curSong=s;bgmNext=0;return}
  if(!audioCtx||audioCtx.state!=='running')return;
  if(paused){bgmNext=0;return}
  if(s!==curSong){curSong=s;bgmStep=0;bgmNext=0}
  if(!s||!musicOn||document.hidden){bgmNext=0;return}
  const song=SONGS[s],now=audioCtx.currentTime;
  if(!bgmNext||bgmNext<now)bgmNext=now+.06;
  while(bgmNext<now+.15){
    song.step(bgmStep,bgmNext,song.dur());
    bgmNext+=song.dur();bgmStep=(bgmStep+1)%song.len;
  }
}

  if(r.type==='heart'){for(let i=0;i<60;i++){const t=i/60*Math.PI*2,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));add(hx*.2,hy*.2,`hsl(${340+R()*20},100%,70%)`,80,3.5,.012);}}

// ボス戦では穴が大きくなる（幅100・深さ60）
// 掘れる場所を探す：掘りかけの穴があればそれを続ける。崖の端や隣の穴にかかる時は少しずらして掘れる場所を探す
function digSpot(){if(bossIntroLong())return null;if(inBasement)return null;
  const p=player;if(state!=='play'||!p.on||p.hole||Math.abs(p.y+p.h-ground)>=12)return null;
  const hw=arenaOn?132:48,hd=arenaOn?72:48,dir=p.facing===-1?-1:1,pc=p.x+p.w/2,center=pc+dir*(hw/2+28);
  const cur=holes.find(h=>h.stage<3&&Math.abs(h.x+h.w/2-center)<h.w/2+8&&(dir>0?(h.x+h.w>p.x+p.w-4&&h.x<p.x+p.w+110):(h.x<p.x+4&&h.x+h.w>p.x-110)));   /* 向いている側の穴だけ続きを掘る（左右対称） */if(cur)return {hole:cur};
  // 敵が入っている穴の前なら「埋める」
  const occ=holes.find(h=>h.stage===3&&Math.abs(h.x+h.w/2-center)<h.w/2+12&&(inHole(h).length>0||(!arenaOn&&!h.secret&&!h.arcade&&p.hole!==h)));if(occ)return {bury:occ};   // ふつうのステージでは、空の穴ももう一回掘ると埋まる
  for(const off of[0,-8,-16,-22,8,16,24]){const c=center+dir*off;
    if(Math.abs(c-pc)<hw/2+6)continue;   // 足元に掘らない
    // 穴の範囲がすべて地面の上にあるか（地面の継ぎ目をまたいでもOK、崖にかかるのはNG）
    let ok=true;for(let sx=c-hw/2+.5;sx<=c+hw/2-.5;sx+=8)if(!groundAt(sx)){ok=false;break}if(!ok||!groundAt(c+hw/2-.5))continue;
    if(holes.some(e=>Math.abs(e.x+e.w/2-c)<(e.w+hw)/2+1))continue;
    return {x:c-hw/2,w:hw,h:hd};}
  return null}
function doDig(){const s=digSpot();if(!s)return false;
  if(s.bury){buryHole(s.bury);holes=holes.filter(h=>h!==s.bury);digCooldown=15;sound('dig');return true}
  let h=s.hole;if(!h){h={x:s.x,y:ground,w:s.w,h:s.h,t:HOLE_T,stage:0};holes.push(h);}h.stage++;h.t=HOLE_T;digCooldown=9;sound('dig');if(h.stage===3){revealTreasure(h);checkSecret(h);}return true}

// 当たり判定は見た目より少し小さめ（かすっただけでミスにならない）

function newBoss(hp=3,short=false){return {x:AX+700,y:short?ground-88:ground+30,w:96,h:88,vx:0,vy:0,hp:hp,st:'intro',t:0,dir:-1,inv:0,flash:0,hole:null,landed:short,short}}

function throwRock(p){const b=boss,sx=b.x+b.w/2,sy=b.y+10,T=48+Math.random()*16,tx=p.x+p.w/2+(Math.random()*80-40),ty=ground-14,g=.35;rocks.push({x:sx,y:sy,vx:(tx-sx)/T,vy:(ty-sy-.5*g*T*T)/T,r:13});sound('throw')}
function bossEscape(){const b=boss;holes=holes.filter(h=>h!==b.hole);b.hole=null;b.y=ground-b.h;b.vy=-15;b.vx=b.x+b.w/2<AX+480?4.5:-4.5;bgo('escape')}
function updateBoss(p,oldY){
  const b=boss;b.t++;if(b.inv>0)b.inv--;if(b.flash>0)b.flash--;
  const phase=b.hp>=3?1:b.hp===2?2:3,L=AX,R=AX+960-b.w,top=ground-b.h;

      if(b.phase==='rumble'){b.y=ground+30;shake=Math.max(shake,2+b.pt/12);if(b.pt%5===0)boom(cx+(Math.random()-.5)*90,ground,3,['#c9a27a','#8a6a4a'],4);if(b.pt===1||b.pt===40)sound('rumble');   // ゴゴゴ…地鳴り
        if(b.pt>=80){b.phase='burst';b.pt=0;b.y=ground-10;b.vy=-13.5;shake=30;sound('slam');sound('boom');boom(cx,ground,46,['#c9a27a','#8a6a4a','#5e3a22'],10);}}   // 地面を突き破る
      else if(b.phase==='burst'){b.vy+=.6;b.y+=b.vy;if(b.y>=top&&b.vy>0){b.y=top;b.vy=0;b.landed=true;shake=20;sound('slam');boom(cx,ground,18,['#c9a27a','#8a6a4a'],6);b.phase='pinwait';b.pt=0;}}
      else if(b.phase==='pinwait'){if(b.pt>14){b.phase='pin';b.pt=0;b.vx=-13.5;b.vy=-19;b.pins=0;sound('boing');}}

        if(b.x<=L){b.x=L;b.vx=Math.abs(b.vx);hit=[b.x,b.y+b.h/2];}
        if(b.x>=R){b.x=R;b.vx=-Math.abs(b.vx);hit=[b.x+b.w,b.y+b.h/2];}
        if(b.y<=70){b.y=70;b.vy=Math.abs(b.vy)*.95;hit=[b.x+b.w/2,b.y];}
        if(b.y>=top&&b.vy>0){b.y=top;
          if(b.pt>170&&Math.abs(b.x+b.w/2-(p.x+p.w/2))>300){b.phase='settle';b.pt=0;b.vx=0;b.vy=0;b.spin=0;shake=24;sound('slam');boom(b.x+b.w/2,ground,22,['#c9a27a','#8a6a4a'],7);}
          else{b.vy=-Math.max(16.5,Math.abs(b.vy)*.97);hit=[b.x+b.w/2,ground];}}
        if(hit){b.pins++;shake=Math.max(shake,8);pinSound(b.pins);boom(hit[0],hit[1],12,['#fff','#ffdf50','#7fe3ff'],7);b.flash=6;popup(Math.max(AX+50,Math.min(AX+910,hit[0])),Math.max(110,hit[1]-12),['ドン！','バン！','ガン！','ボヨン！'][b.pins%4],'#ffdf50',26,32);}}
      else if(b.phase==='settle'){b.y=top;if(b.pt>=28){sound('roar');shake=14;b.phase='roar';b.pt=0;}}                 // 雄たけび
      else if(b.phase==='roar'){if(b.pt>115){bgo('walk');banner('','穴を掘って 大王を落とし、頭をふめ！',140)}}}}
  else if(b.st==='walk'){const tx=p.x+p.w/2-(b.x+b.w/2);if(Math.abs(tx)>8)b.dir=Math.sign(tx);b.x+=b.dir*(.8+phase*.45);
    if(b.t>(phase===3?60:phase===2?85:110)){const r=Math.random();
      if(phase===1){if(r<.5){bgo('jump');b.vy=-15;b.vx=Math.max(-5,Math.min(5,tx/45))}else bgo('throw')}
      else if(r<.33){bgo('jump');b.vy=-15.5;b.vx=Math.max(-6,Math.min(6,tx/42))}
      else if(r<.6)bgo('throw');

  else if(b.st==='jump'||b.st==='escape'){b.vy+=.7;b.x+=b.vx;b.y+=b.vy;if(b.y>=top&&b.vy>0){b.y=top;b.vy=0;b.vx=0;if(b.st==='jump'){shake=18;sound('slam');const sp=4+phase;waves.push({x:b.x+b.w/2-30,dir:-1,sp},{x:b.x+b.w/2+30,dir:1,sp});boom(b.x+b.w/2,ground,10,['#c9a27a'])}bgo('walk')}}
  else if(b.st==='throw'){if(b.t===30||(phase>=2&&b.t===48)||(phase===3&&b.t===66))throwRock(p);if(b.t>95)bgo('walk')}
  else if(b.st==='windup'){if(b.t%6===0)boom(b.x+b.w/2-b.dir*40,ground,2,['#c9a27a'],3);if(b.t>45)bgo('charge')}
  else if(b.st==='charge'){b.x+=b.dir*(4.5+phase);if(b.t%4===0)boom(b.x+b.w/2-b.dir*40,ground,2,['#c9a27a'],3);if(b.x<=L||b.x>=R){shake=14;sound('slam');bgo('walk')}}

    // 倒した瞬間：時間が止まったように白く光る → くるくる回りながら爆発 → 王冠が飛んでいき、大爆発で空のかなたへ
    const bcx=b.x+b.w/2,bcy=b.y+b.h/2;

    else if(b.t<130){b.spin=(b.spin||0)+.08+(b.t-36)*.004;b.y-=.4;
      if(b.t%6===0){boom(b.x+Math.random()*b.w,b.y+Math.random()*b.h,14,['#ffdf50','#ff655e','#fff']);if(b.t%12===0)sound('boom');shake=Math.max(shake,8);}
      if(b.t===60&&!b.crownFly){b.crownFly={x:bcx,y:b.y+5,vx:3.5,vy:-11,spin:0};sound('boing');}}
    else{if(b.t===130){b.vy=-12;shake=30;sound('slam');sound('boom');boom(bcx,bcy,60,['#fff','#ffdf50','#ff655e','#7fe3ff'],12);}
      b.spin=(b.spin||0)+.35;b.vy+=.3;b.y+=b.vy;b.x+=4;}
    if(b.crownFly){const cf=b.crownFly;cf.vy+=.35;cf.x+=cf.vx;cf.y+=cf.vy;cf.spin+=.2;if(cf.y>ground-10&&cf.vy>0){cf.y=ground-10;cf.vy*=-.45;cf.vx*=.6;if(Math.abs(cf.vy)<1){cf.vy=0;cf.vx=0;}}}
    if(b.t>210&&!b.clearPlayed){b.clearPlayed=true;playBossClear();banner('GAME CLEAR!','モグラ大王 ドリモグを たおした！',300)}
    // 読み込み失敗時や再生停止時にも進行を止めない（最大8秒）。

          // 踏んだら、ボスが飛び出す方向と反対側へ大きく弾き飛ばされる
          {const esc=b.x+b.w/2<AX+480?1:-1;p.kickVx=-esc*5.5;p.kickT=40;p.facing=-esc;}shake=16;sound('bosshit');boom(p.x+p.w/2,b.y+10,14,['#fff','#ffdf50']);

function resetMaze(){

function mazeWalk(pos,move){
  const next=[pos[0]+move[0],pos[1]+move[1]];
  return MAZE[next[1]]?.[next[0]]==='.'?next:null;
}
function mazeEnemyStep(from,target){
  const seen=new Set([from.join(',')]),queue=[[from,null]];
  for(let i=0;i<queue.length;i++){
    const [pos,first]=queue[i];
    if(pos[0]===target[0]&&pos[1]===target[1])return first||from;
    for(const move of Object.values(MAZE_MOVES)){
      const next=mazeWalk(pos,move);
      if(!next||seen.has(next.join(',')))continue;
      seen.add(next.join(','));queue.push([next,first||next]);
    }
  }
  return from;
}
const MAZE_GLIDE_FRAMES=10;   // 主人公が1マス進むフレーム数
// 敵は主人公の操作とは関係なく、一定の速さで毎フレームなめらかに進む（1フレームあたりのマス数）
const MAZE_FOE_SPEEDS=[1/24,1/32],MAZE_FOE_WAIT=45,MAZE_HIT_DISTANCE=.6;
// 分かれ道で主人公を追いかける確率。残りは気ままにうろうろする
const MAZE_FOE_CHASE=[.55,.35];
function spawnMazeFoes(){
  maze.foes=MAZE_ENEMY_STARTS.map((pos,i)=>({pos,prev:null,next:null,t:0,speed:MAZE_FOE_SPEEDS[i],chase:MAZE_FOE_CHASE[i],wait:MAZE_FOE_WAIT,look:-1,phase:0}));
}
function mazeHeroPosition(){
  if(!maze.heroNext)return maze.hero;
  return maze.hero.map((value,i)=>value+(maze.heroNext[i]-value)*maze.heroT);
}
const MAZE_OPPOSITE={up:'down',down:'up',left:'right',right:'left'};
// 主人公は押した方向へ壁にぶつかるまで進み続ける。
// 先に押しておいた方向（want）は、曲がれるマスに着いたところで自動的に曲がる
function updateMazeHero(frames){
  if(maze.heroNext&&maze.want&&maze.want===MAZE_OPPOSITE[maze.dir]){
    [maze.hero,maze.heroNext]=[maze.heroNext,maze.hero];maze.heroT=1-maze.heroT;maze.dir=maze.want;
  }
  let budget=frames/MAZE_GLIDE_FRAMES;
  while(budget>0&&!maze.done){
    if(!maze.heroNext){
      if(maze.want&&mazeWalk(maze.hero,MAZE_MOVES[maze.want]))maze.dir=maze.want;
      const next=maze.dir&&mazeWalk(maze.hero,MAZE_MOVES[maze.dir]);
      if(!next){maze.dir=null;return;}
      maze.heroNext=next;maze.heroT=0;
      if(maze.dir==='left'||maze.dir==='right')maze.facing=maze.dir==='left'?-1:1;
    }
    const used=Math.min(budget,1-maze.heroT);
    maze.heroT+=used;budget-=used;
    if(maze.heroT>=1){
      maze.hero=maze.heroNext;maze.heroNext=null;maze.heroT=0;
      if(maze.stars.delete(maze.hero.join(','))){sound('coin');maze.sparks.push({x:maze.hero[0],y:maze.hero[1],t:0});}
      if(maze.stars.size===0)mazeClear();
    }
  }
}
function mazeFoePosition(foe){
  if(!foe.next)return foe.pos;
  return foe.pos.map((value,i)=>value+(foe.next[i]-value)*foe.t);
}
// 次に進むマスを選ぶ。来た道へは行き止まりのときだけ戻るので、止まらずに歩き続ける
function mazeFoeChoice(foe){
  const all=Object.values(MAZE_MOVES).map(move=>mazeWalk(foe.pos,move)).filter(Boolean);
  if(!all.length)return null;
  const ahead=all.filter(p=>!foe.prev||p[0]!==foe.prev[0]||p[1]!==foe.prev[1]);
  const options=ahead.length?ahead:all;
  if(Math.random()<foe.chase){
    const chase=mazeEnemyStep(foe.pos,maze.hero);
    if(options.some(p=>p[0]===chase[0]&&p[1]===chase[1]))return chase;
  }
  return options[Math.floor(Math.random()*options.length)];
}
function updateMazeFoe(foe,frames){
  if(foe.wait>0){foe.wait-=frames;return;}
  let budget=foe.speed*frames;
  while(budget>0){
    if(!foe.next){
      const step=mazeFoeChoice(foe);
      if(!step)return;
      foe.next=step;foe.t=0;
      if(step[0]!==foe.pos[0])foe.look=Math.sign(step[0]-foe.pos[0]);
    }
    const used=Math.min(budget,1-foe.t);
    foe.t+=used;budget-=used;foe.phase+=used;
    if(foe.t>=1){foe.prev=foe.pos;foe.pos=foe.next;foe.next=null;foe.t=0;}
  }
}
// 画面の描きかえ（requestAnimationFrame）ごとに、実際に経過した時間ぶんだけ進める。
// 60fps固定の更新に合わせると、画面の更新タイミングとずれてカクついて見えるため。
function updateMazeMotion(frames){
  if(maze.done)return;
  maze.time+=frames;
  maze.sparks=maze.sparks.filter(spark=>(spark.t+=frames)<24);
  updateMazeHero(frames);
  if(maze.done)return;
  maze.foes.forEach(foe=>updateMazeFoe(foe,frames));
  const [hx,hy]=mazeHeroPosition();
  if(maze.foes.some(foe=>{const [fx,fy]=mazeFoePosition(foe);return Math.hypot(fx-hx,fy-hy)<MAZE_HIT_DISTANCE;}))mazeHit();
  drawMaze();
}

function mazeMove(dir){
  if(arcadeGame!=='maze'||maze.done)return;
  maze.want=dir;
  if(!maze.heroNext&&!maze.dir&&mazeWalk(maze.hero,MAZE_MOVES[dir]))maze.dir=dir;

function drawMaze(){
  const size=32;
  mazeCtx.fillStyle='#102035';mazeCtx.fillRect(0,0,416,288);
  MAZE.forEach((row,y)=>Array.from(row).forEach((cell,x)=>{
    const px=x*size,py=y*size;
    if(cell==='#'){
      mazeCtx.fillStyle='#3c6181';mazeCtx.fillRect(px+1,py+1,size-2,size-2);
      mazeCtx.fillStyle='#527b9c';mazeCtx.fillRect(px+5,py+5,size-10,3);
    }else if(maze.stars.has(x+','+y)){
      // 星はそれぞれ違うタイミングでキラキラまたたく
      const twinkle=.5+.5*Math.sin(maze.time*.09+x*1.7+y*2.3),r=2.6+twinkle*1.6;
      mazeCtx.save();mazeCtx.translate(px+16,py+16);
      mazeCtx.globalAlpha=.65+twinkle*.35;mazeCtx.fillStyle='#ffe391';
      mazeCtx.rotate(Math.PI/4);mazeCtx.fillRect(-r,-r,r*2,r*2);
      if(twinkle>.85){mazeCtx.rotate(-Math.PI/4);mazeCtx.fillStyle='#fff';mazeCtx.fillRect(-.7,-7,1.4,14);mazeCtx.fillRect(-7,-.7,14,1.4);}
      mazeCtx.restore();
    }
  }));
  for(const spark of maze.sparks){   // 星を取ったときのはじける光
    const k=spark.t/24;mazeCtx.save();mazeCtx.globalAlpha=1-k;mazeCtx.fillStyle='#fff3a6';
    for(let a=0;a<6;a++){const ang=a*Math.PI/3,d=4+k*14;mazeCtx.fillRect(spark.x*size+16+Math.cos(ang)*d-1.5,spark.y*size+16+Math.sin(ang)*d-1.5,3,3);}
    mazeCtx.restore();
  }
  const [heroX,heroY]=mazeHeroPosition();
  maze.foes.forEach((foe,i)=>{
    const [fx,fy]=mazeFoePosition(foe);
    const bounce=(1-Math.cos(foe.phase*Math.PI*2))*.6;
    const blink=foe.wait>0&&Math.floor(foe.wait/6)%2;
    if(!blink)drawMazeCritter(fx*size+16,fy*size+16-bounce,i,foe.look);
    // 近くまで来たら「！」で知らせる

function slotWinningReels(reels,prize){
  if(!prize)return [];
  if(prize.rank<=2)return reels.map(()=>true);
  if(prize.rank===3)return reels.map(symbol=>symbol===0);
  const pair=reels.find((symbol,i)=>reels.indexOf(symbol)!==i);
  return reels.map(symbol=>symbol===pair);
}

function slotPrize(reels){

function playSlotPayout(prize){
  const notes=prize.rank===1?[523,659,784,1047]:[659,880];
  notes.forEach((note,i)=>tone(note,.18,'triangle',.085,i*.085));
  const duration=[0,18,13,9,6][prize.rank];
  let tick=0;
  slotSpin.disabled=true;
  slotPayout.hidden=false;
  slotPayoutMeter.max=prize.coins;
  slotPayoutMeter.value=0;
  slotPayoutCount.textContent='コイン 0 / '+prize.coins+'枚';
  slotTimer=setInterval(()=>{
    tick++;
    const count=Math.ceil(tick*prize.coins/duration);
    slotPayoutMeter.value=count;
    slotPayoutCount.textContent='コイン '+count+' / '+prize.coins+'枚';
    const pitch=1120+(tick%4)*120;
    tone(pitch,.09,'triangle',.045,0,pitch*1.2);
    tone(pitch*1.47,.065,'sine',.035,.026);
    if(tick>=duration)stopSlotSpin();
  },75);
}
function startSlotSpin(){
  if(arcadeGame!=='slots'||slotTimer!==null||slotSpun)return;
  slotSpun=true;
  const result=Array.from({length:3},randomSlotSymbol);
  const stopAt=[10,15,20],play=document.getElementById('slotPlay');
  let tick=0,reach=false;
  slotPayout.hidden=true;slotSpin.disabled=true;slotStatus.textContent='回転中…';
  slotTimer=setInterval(()=>{
    tick++;
    const spinning=stopAt.map(at=>tick<at);
    drawSlots(result.map((symbol,i)=>spinning[i]?randomSlotSymbol():symbol),[],spinning);
    if(stopAt.includes(tick))tone(330,.07,'square',.07,0,160);   // リールが止まる「カチッ」
    else if(reach)tone(700+(tick-stopAt[1])*35,.05,'triangle',.04);
    // 2つそろったらリーチ！ 3つ目をじらしてゆっくり止める
    if(tick===stopAt[1]&&result[0]===result[1]){
      reach=true;stopAt[2]=36;play.classList.add('reach');
      slotStatus.textContent='リーチ！';tone(880,.12,'square',.07);tone(1175,.16,'square',.07,.12);
    }
    if(tick<stopAt[2])return;
    stopSlotSpin();play.classList.remove('reach');
    const prize=slotPrize(result);
    drawSlots(result,slotWinningReels(result,prize));
    showSlotRank(prize);
    if(prize)slotConfetti(prize.rank===1?60:prize.rank===2?36:16);
    if(!prize){slotStatus.textContent='また挑戦してね。地上へ戻ります…';leaveArcadeSoon(2200);return;}
    const oldLives=lives;
    collectCoins(prize.coins,player.x+17,player.y-20);
    slotStatus.textContent='コイン '+prize.coins+'枚（+'+
      prize.coins*COIN_POINTS+'点）'+(lives>oldLives?' 1UP！':'');
    playSlotPayout(prize);
    leaveArcadeSoon(2600+[0,18,13,9,6][prize.rank]*75);
  },80);
}

// 主人公：もらったイラストを使う（足もと＝py+42、幅34の枠の中央。歩くと少しゆれ、ジャンプで少しのびる）
function drawPlayerAt(px,py,facing,pose,stride=0,context=x){
  const X=context,f=facing>=0?1:-1;if(!HERO_IMG.complete||!HERO_IMG.naturalWidth)return;
  const walking=pose==='walk',jumping=pose==='jump';
  const H=80,W=H*HERO_IMG.naturalWidth/HERO_IMG.naturalHeight;
  const sw=walking?Math.sin(stride*.19):0,bob=walking?Math.abs(sw)*2:0;
  if(walking){const im=f>0?HERO_R:HERO_L;if(im.complete&&im.naturalWidth){const w2=H*im.naturalWidth/im.naturalHeight,lift=Math.abs(sw)*2.2;
    X.save();X.translate(px+17,py+42-lift);X.rotate(sw*f*.06);X.drawImage(im,-w2/2,-H,w2,H);X.restore();return;}}
  X.save();X.translate(px+17,py+42);
  X.scale(f,1);if(jumping)X.scale(.95,1.05);
  X.drawImage(HERO_IMG,-W/2,-H-bob,W,H);
  X.restore();}
function drawCoin(cx,cy,r,phase){
  const turn=Math.cos(phase),w=Math.max(.14,Math.abs(turn))*r*.82,edge=Math.min(4,r*.2)*(1-Math.abs(turn)*.6);
  x.save();
  ell(cx+edge*Math.sign(turn||1)*.6,cy,w+edge*.5,r,'#9a5f00');   // ふちの厚み
  const g=x.createLinearGradient(cx-w,cy-r,cx+w,cy+r);
  g.addColorStop(0,'#fff6b0');g.addColorStop(.35,'#ffd23a');g.addColorStop(.7,'#f2a900');g.addColorStop(1,'#c47c00');
  x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,w,r,0,0,7);x.fill();
  x.strokeStyle='#b67400';x.lineWidth=1.6;x.beginPath();x.ellipse(cx,cy,w*.72,r*.74,0,0,7);x.stroke();   // 内側のふち
  if(Math.abs(turn)>.35){   // 表の星マーク
    x.fillStyle='#e39a00';x.beginPath();
    for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.2:r*.46;x.lineTo(cx+Math.cos(a)*rr*w/r*1.1,cy+Math.sin(a)*rr);}
    x.closePath();x.fill();
  }
  x.globalAlpha=.75;ell(cx-w*.35,cy-r*.45,w*.22,r*.28,'#fffbe0');x.globalAlpha=1;   // 光の反射
  x.restore();
}
// ダイヤ：ブリリアントカット。足もと(by)からの高さ h
function drawGem(cx,by,h,glow=true){
  const w=h*1.12,top=by-h,crown=top+h*.34,t=Date.now();
  const facet=(pts,col)=>{x.fillStyle=col;x.beginPath();pts.forEach(([px,py],i)=>i?x.lineTo(px,py):x.moveTo(px,py));x.closePath();x.fill();};
  if(glow){const pulse=.55+.25*Math.sin(t*.005+cx);const g=x.createRadialGradient(cx,by-h*.5,h*.1,cx,by-h*.5,h*1.1);g.addColorStop(0,`rgba(140,230,255,${pulse*.55})`);g.addColorStop(1,'rgba(140,230,255,0)');x.fillStyle=g;x.fillRect(cx-h*1.2,by-h*1.6,h*2.4,h*2.2);}
  // 下側（パビリオン）：中心へ集まる面
  const pav=[[-.5,'#1a5fb0'],[-.3,'#3a9be8'],[-.1,'#7fd4ff'],[.1,'#4fb4ef'],[.3,'#2a7ad0'],[.5,'#164a90']];
  for(let k=0;k<pav.length-1;k++)facet([[cx+w*pav[k][0],crown],[cx+w*pav[k+1][0],crown],[cx,by]],pav[k][1]);
  // 上側（クラウン）とてっぺんの平らな面（テーブル）
  facet([[cx-w*.5,crown],[cx-w*.32,top],[cx-w*.16,crown]],'#9fe4ff');
  facet([[cx-w*.32,top],[cx-w*.16,crown],[cx,top]],'#c8f2ff');
  facet([[cx-w*.16,crown],[cx,top],[cx+w*.16,crown]],'#e8fbff');
  facet([[cx,top],[cx+w*.16,crown],[cx+w*.32,top]],'#b0ecff');
  facet([[cx+w*.32,top],[cx+w*.16,crown],[cx+w*.5,crown]],'#5cc4f4');
  x.strokeStyle='#0b3a70';x.lineWidth=Math.max(1,h*.045);x.lineJoin='round';
  x.beginPath();x.moveTo(cx-w*.32,top);x.lineTo(cx+w*.32,top);x.lineTo(cx+w*.5,crown);x.lineTo(cx,by);x.lineTo(cx-w*.5,crown);x.closePath();x.stroke();   // ふち
  x.strokeStyle='#ffffffaa';x.lineWidth=Math.max(.8,h*.03);x.beginPath();x.moveTo(cx-w*.5,crown);x.lineTo(cx+w*.5,crown);x.stroke();
  // 虹色のきらめき
  const hue=(t*.08+cx)%360;x.globalAlpha=.35;facet([[cx-w*.1,crown],[cx+w*.1,crown],[cx,by-h*.12]],`hsl(${hue},100%,75%)`);x.globalAlpha=1;
  x.globalAlpha=.9;facet([[cx-w*.25,top+h*.05],[cx-w*.08,top+h*.05],[cx-w*.18,crown-h*.04]],'#fff');x.globalAlpha=1;
  const tw=(t*.004+cx*.01)%(Math.PI*2);   // キラッと光る十字
  if(Math.sin(tw)>.5){const k=(Math.sin(tw)-.5)/.5,sx=cx+w*.22,sy=top+h*.15,len=h*.45*k;x.fillStyle='#fff';x.beginPath();x.moveTo(sx,sy-len);x.lineTo(sx+len*.12,sy);x.lineTo(sx,sy+len);x.lineTo(sx-len*.12,sy);x.closePath();x.fill();x.beginPath();x.moveTo(sx-len,sy);x.lineTo(sx,sy-len*.12);x.lineTo(sx+len,sy);x.lineTo(sx,sy+len*.12);x.closePath();x.fill();}
}
// 宝箱：木の板・金具・鍵穴つき。足もと(by)からの大きさ
function drawChest(cx,by,w){
  const h=w*.62,lid=h*.42,left=cx-w/2,top=by-h;
  const wood=x.createLinearGradient(0,top,0,by);wood.addColorStop(0,'#b97a3e');wood.addColorStop(1,'#7a4a22');
  x.fillStyle=wood;x.fillRect(left,top+lid,w,h-lid);   // 箱
  x.strokeStyle='#5e3517';x.lineWidth=1;for(let k=1;k<3;k++){const yy=top+lid+(h-lid)*k/3;x.beginPath();x.moveTo(left,yy);x.lineTo(left+w,yy);x.stroke();}
  const lg=x.createLinearGradient(0,top,0,top+lid);lg.addColorStop(0,'#d69552');lg.addColorStop(1,'#9a5f2c');
  x.fillStyle=lg;x.beginPath();x.moveTo(left,top+lid);x.lineTo(left,top+lid*.45);x.quadraticCurveTo(cx,top-lid*.45,left+w,top+lid*.45);x.lineTo(left+w,top+lid);x.closePath();x.fill();   // 丸いふた
  x.fillStyle='#3d220e';x.fillRect(left,top+lid-1.5,w,3);   // ふたのすき間
  const gold=x.createLinearGradient(0,top,0,by);gold.addColorStop(0,'#fff0a0');gold.addColorStop(.5,'#ffc928');gold.addColorStop(1,'#c98a00');
  x.fillStyle=gold;
  for(const bx of[left+w*.12,left+w*.88-w*.1]){x.fillRect(bx,top+lid*.2,w*.1,h-lid*.2);}   // 金の帯
  x.fillRect(left,by-3,w,3);
  for(const bx of[left+w*.17,left+w*.83])for(const yy of[top+lid+4,by-7])ell(bx,yy,1.3,1.3,'#fff6c0');   // びょう
  x.fillStyle=gold;x.fillRect(cx-w*.11,top+lid-h*.12,w*.22,h*.3);   // 錠前
  x.fillStyle='#3d220e';x.beginPath();x.arc(cx,top+lid+h*.02,1.8,0,7);x.fill();x.fillRect(cx-.8,top+lid+h*.02,1.6,h*.09);
  x.globalAlpha=.35;x.fillStyle='#fff';x.fillRect(left+3,top+lid*.35,w*.35,2);x.globalAlpha=1;
}
// ライフのハート：つやのある立体的なハート。gold=true で金のハート（キラキラと「×5」つき）
function heartPath(cx,cy,w){const h=w*.9,top=cy-h*.42;

  x.fillStyle='#2a2558';x.beginPath();x.moveTo(0,ground);for(let k=0;k<=16;k++){const px=k*W/16;x.lineTo(px,ground-90-Math.sin(k*1.3)*40-Math.sin(k*.7)*30);}x.lineTo(W,ground);x.closePath();x.fill();
  // 空の国のお城（遠くの丘の上）
  const cx0=W-230,cy0=ground-150;x.fillStyle='#3a3170';
  x.fillRect(cx0-50,cy0,100,70);for(const [tx,tw,th] of[[-58,18,95],[40,18,95],[-14,28,120]]){x.fillRect(cx0+tx,cy0+70-th,tw,th);x.beginPath();x.moveTo(cx0+tx-4,cy0+70-th);x.lineTo(cx0+tx+tw/2,cy0+70-th-26);x.lineTo(cx0+tx+tw+4,cy0+70-th);x.closePath();x.fill();}
  x.fillStyle='#ffd88a';for(const [wx,wy] of[[-48,-5],[46,-5],[-4,-30],[-30,30],[20,30],[0,45]])if(Math.sin(endT*.02+wx)>-.7)x.fillRect(cx0+wx,cy0+wy,5,8);   // 明かりのともる窓
  x.fillStyle='#ff7aa8';x.beginPath();x.moveTo(cx0,cy0-76);x.lineTo(cx0+16,cy0-70+Math.sin(endT*.1)*2);x.lineTo(cx0,cy0-64);x.closePath();x.fill();x.fillStyle='#3a3170';x.fillRect(cx0-1,cy0-78,2,28);   // 旗
  // 近くの丘
  const hill=x.createLinearGradient(0,ground-60,0,ground);hill.addColorStop(0,'#2f5a52');hill.addColorStop(1,'#1f3f3a');
  x.fillStyle=hill;x.beginPath();x.moveTo(0,ground);x.quadraticCurveTo(W*.25,ground-70,W*.5,ground-20);x.quadraticCurveTo(W*.75,ground-60,W,ground-10);x.lineTo(W,ground);x.closePath();x.fill();
  // 地面と花
  const gr=x.createLinearGradient(0,ground,0,H);gr.addColorStop(0,'#3f7a4f');gr.addColorStop(1,'#1d3a28');x.fillStyle=gr;x.fillRect(0,ground,W,H-ground);
  x.fillStyle='#5a9a62';x.fillRect(0,ground,W,6);
  x.fillStyle='#4a8a56';x.beginPath();for(let gx=0;gx<W;gx+=6){const h=3+Math.abs(Math.sin(gx*.9))*5;x.moveTo(gx,ground+2);x.lineTo(gx+2,ground-h);x.lineTo(gx+4,ground+2);}x.fill();
  for(const f of END_FLOWERS){for(let k=0;k<5;k++){const a=k*Math.PI*2/5;ell(f.x+Math.cos(a)*f.s,f.y+Math.sin(a)*f.s,f.s*.8,f.s*.8,f.c);}ell(f.x,f.y,f.s*.6,f.s*.6,'#ffcf40');}
  // ホタル
  for(let k=0;k<14;k++){const fx=(k*97+Math.sin(endT*.01+k)*60+endT*.2)%W,fy=ground-40-((k*53)%160)+Math.sin(endT*.03+k*2)*14,a=.4+.6*Math.abs(Math.sin(endT*.05+k));
    const fg=x.createRadialGradient(fx,fy,0,fx,fy,9);fg.addColorStop(0,`rgba(240,255,140,${a})`);fg.addColorStop(1,'rgba(200,255,100,0)');x.fillStyle=fg;x.fillRect(fx-9,fy-9,18,18);ell(fx,fy,1.8,1.8,'#ffffd0');}
}
// 空にのぼる灯籠（ゆらゆら光りながら上へ）
const END_LANTERNS=Array.from({length:16},(_,i)=>({x:(i*137+40)%W,sp:.25+(i%5)*.07,ph:i*1.7,s:.7+(i%3)*.25,off:i*83}));
function drawEndingExtras(){const t=endT;
  // ゆれるスポットライト
  x.save();x.globalCompositeOperation='lighter';
  for(const [sx,dir,col] of[[120,1,'255,220,150'],[W-120,-1,'180,210,255']]){const a=-Math.PI/2+dir*(.35+Math.sin(t*.012+sx)*.3);
    const g=x.createLinearGradient(sx,ground,sx+Math.cos(a)*520,ground+Math.sin(a)*520);g.addColorStop(0,`rgba(${col},.28)`);g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=g;x.beginPath();x.moveTo(sx,ground);x.lineTo(sx+Math.cos(a-.09)*560,ground+Math.sin(a-.09)*560);x.lineTo(sx+Math.cos(a+.09)*560,ground+Math.sin(a+.09)*560);x.closePath();x.fill();}
  x.restore();
  // 灯籠
  for(const l of END_LANTERNS){const y=ground-((t*l.sp+l.off)%(ground+60)),lx=l.x+Math.sin(t*.02+l.ph)*12,flick=.75+.25*Math.sin(t*.2+l.ph);
    const g=x.createRadialGradient(lx,y,1,lx,y,22*l.s);g.addColorStop(0,`rgba(255,190,90,${.45*flick})`);g.addColorStop(1,'rgba(255,190,90,0)');x.fillStyle=g;x.fillRect(lx-24*l.s,y-24*l.s,48*l.s,48*l.s);
    x.fillStyle=`rgba(255,${170+flick*40},90,.95)`;x.beginPath();x.moveTo(lx-6*l.s,y-8*l.s);x.lineTo(lx+6*l.s,y-8*l.s);x.lineTo(lx+5*l.s,y+7*l.s);x.lineTo(lx-5*l.s,y+7*l.s);x.closePath();x.fill();
    ell(lx,y+5*l.s,3*l.s,1.6*l.s,'#fff3c0');}
  // 流れ星
  const ph=(t%240)/240;if(ph<.35){const k=ph/.35,sx=W*.9-k*W*.6,sy=30+k*110;const g=x.createLinearGradient(sx,sy,sx+110,sy-40);g.addColorStop(0,'#fff');g.addColorStop(1,'#fff0');x.strokeStyle=g;x.lineWidth=2.5;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+110,sy-40);x.stroke();ell(sx,sy,2.5,2.5,'#fff');}
  // 打ち上げ中の花火の玉
  for(const r of endRockets){ell(r.x,r.y,3,3,'#fff6c0');ell(r.x,r.y,6,6,'#ffd98a55');}
}
function drawEnding(){
  drawEndingBg();
  drawEndingExtras();
  drawParts();
  if(endingDone())drawQuestDoor();
  const princess=endingPrincessPosition();
  if(endingRare){drawRainbow();const jump=k=>Math.abs(Math.sin(endT*.13+k))*18;
    drawEndPlayer();
    drawEndScaled(princess.x+17,princess.y+46,()=>princessRound?drawPlayerAt(princess.x,princess.y+4,endP&&endP.x<princess.x?-1:1,'front'):drawPartner(princess.x,princess.y,endP&&endP.x<princess.x?-1:1));   // ソラ姫が主人公のときは、となりによし太くん
    drawMoleFriend(W/2+150,ground-88*.75*END_SCALE-jump(2),.75*END_SCALE,endT);
    x.textAlign='center';fancyText('★ RARE ENDING ★',W/2,50,34,Math.floor(endT/20)%2?'gold':'white');x.textAlign='left';
  }else if(endingPair){
    // 花のアーチ
    x.strokeStyle='#fff8';x.lineWidth=6;x.beginPath();x.arc(W/2,ground,150,Math.PI,0);x.stroke();for(let k=0;k<=12;k++){const a=Math.PI+k*Math.PI/12;x.fillStyle=['#ff9ad5','#fff','#ffd84d'][k%3];x.beginPath();x.arc(W/2+Math.cos(a)*150,ground+Math.sin(a)*150,7,0,7);x.fill();}
    drawEndPlayer();drawEndScaled(princess.x+17,princess.y+46,()=>drawPartner(princess.x,princess.y,endP&&endP.x>princess.x?1:-1));
  }else{drawEndPlayer();}
  drawParts(true);
  x.textAlign='center';
  const sy=creditsY();
  credits().forEach((l,i)=>{const y=sy+i*46;if(l&&y>-40&&y<ground-(endingRare?175:110)){const head=i===0||l.startsWith('—')||l.startsWith('★');
    const edge=Math.min(1,(y+40)/80,(ground-(endingRare?175:110)-y)/60);x.globalAlpha=Math.max(0,edge);   // 上下のはしで ふわっと消える
    if(head)fancyText(l,W/2,y,34,'gold');else if(/^(HERO|PRINCESS|FRIEND)/.test(l))fancyText(l,W/2,y,26,'blue');else fancyText(l,W/2,y,26,'white');x.globalAlpha=1;}});
  if(endingDone()){const pulse=1+Math.sin(endT*.08)*.04;x.save();x.translate(W/2,182);x.scale(pulse,pulse);fancyText('THE END',0,0,76,'gold');x.restore();
    for(let k=0;k<6;k++){const a=endT*.03+k*1.05,sx=W/2+Math.cos(a)*190,sy=160+Math.sin(a*1.3)*28,len=4+Math.abs(Math.sin(endT*.1+k))*7;x.fillStyle='#fff8c0';x.beginPath();x.moveTo(sx,sy-len);x.lineTo(sx+len*.25,sy);x.lineTo(sx,sy+len);x.lineTo(sx-len*.25,sy);x.closePath();x.fill();x.beginPath();x.moveTo(sx-len,sy);x.lineTo(sx,sy-len*.25);x.lineTo(sx+len,sy);x.lineTo(sx,sy+len*.25);x.closePath();x.fill();}
    fancyText('FINAL SCORE  '+score,W/2,245,30,'white');if(Math.floor(endT/30)%2)fancyText('タップで もういちど あそぶ',W/2,298,22,'blue');}

// 固定60fps：120Hz画面のスマホでも速くならない
// ===== 一時停止（ゲーム中に画面をタップ） =====
let paused=false;
function canPause(){return mode==='game'&&state==='play'}
function clearInput(){keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;digBuf=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))}
function setPause(on){if(on&&!canPause())return;if(paused===on)return;paused=on;clearInput();if(on)tone(520,.08,'square',.05);else tone(780,.08,'square',.05);}
function drawPause(){x.fillStyle='#0009';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='900 72px system-ui';x.fillText('PAUSE',W/2,250);
  x.font='bold 24px system-ui';x.fillText('画面をタップで さいかい',W/2,305);x.font='18px system-ui';x.fillStyle='#cfd8ea';x.fillText('SCORE '+score+'　　♥ × '+lives,W/2,350);x.textAlign='left';}
const STEP=1000/60;let last=0,acc=0;
const JUMP_BUFFER_FRAMES=8,COYOTE_FRAMES=6;
const RUN_JUMP_SPEED=1.35;     // 走りジャンプの横の速さ（ふつうの何倍か）
const DOUBLE_JUMP_WINDOW=3.5;  // 二段ジャンプできる「てっぺん付近」の広さ（上下の速さがこれより小さいとき）
// 1コマの時間は毎回わずかにぶれる。そのままだと「更新0回のコマ」と「2回のコマ」が混ざってカクつくので、
// 60Hz・120Hz・30Hz の画面に近い時間はちょうどの値にそろえる
function snapFrameTime(dt){for(const n of[.5,1,2])if(Math.abs(dt-STEP*n)<1.2)return STEP*n;return dt}
function loop(t){if(!last)last=t;const dt=snapFrameTime(Math.min(100,t-last));if(state==='arcade'&&arcadeGame==='maze'&&!paused)updateMazeMotion(dt/STEP);acc+=dt*(mode==='title'?.85:1);last=t;if(paused)acc=0;while(acc>=STEP){update();acc-=STEP;}mp3LoopCheck();draw();if(mode==='title')drawTitle();if(paused)drawPause();requestAnimationFrame(loop)}
if(!restoreQuestEnding())startOpening();   // 最初はオープニングから（そのあとタイトルのデモへ）
requestAnimationFrame(loop);

// キーボード
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(state==='endingCut'&&mode==='game'){finishEndingCut();return;}if(mode==='opening'&&k!=='enter'&&k!==' '){endOpening();return;}if(mode==='title'||mode==='opening'){if(k==='enter'||k===' '){e.preventDefault();startGame();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}return}if(k==='p'||k==='escape'){if(!e.repeat)setPause(!paused);return}if(paused)return;if(['arrowleft','a','arrowright','d',' ','arrowup','w'].includes(k))unlockAudio();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if([' ','arrowup','w'].includes(k)){keys.jump=true;e.preventDefault()}if(k==='x'){unlockAudio();if(!e.repeat)dig();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}if(k==='r'){if(state==='lose')retry();else reset()}});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if([' ','arrowup','w'].includes(k))keys.jump=false});

// 方向パッド：大きな ◀ ▶ の2つ。指を離さずスライドで左右を切り替え（ジャンプは右のジャンプボタンで）
const dpad=document.getElementById('dpad'),[dl,dr]=dpad.children;let dpadId=null;
function dpadSet(e){const r=dpad.getBoundingClientRect(),right=e.clientX>r.left+r.width/2;keys.left=!right;keys.right=right;padJump=false;dl.classList.toggle('on',!right);dr.classList.toggle('on',right);}
function dpadEnd(e){if(e.pointerId!==dpadId)return;dpadId=null;keys.left=keys.right=false;padJump=false;for(const s of dpad.children)s.classList.remove('on')}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();dpadId=e.pointerId;try{dpad.setPointerCapture(e.pointerId)}catch(_){}dpadSet(e)});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadId)dpadSet(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,dpadEnd));

// ボタン（マルチタッチ対応）
function holdButton(el,down,up){let id=null;el.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}el.classList.add('on');down()});const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('on');up()};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,end))}
holdButton(document.getElementById('jump'),()=>keys.jump=true,()=>keys.jump=false);
holdButton(document.getElementById('dig'),()=>{dig();},()=>{}); // 1タップにつき1回だけ掘る。デモAIの自動掘削は維持

c.addEventListener('pointerdown',()=>{if(mode==='opening'){endOpening();return;}if(state==='endingCut'){finishEndingCut();return;}if(mode==='title')return;unlockAudio();if(paused){setPause(false);return}if(state==='lose')retry();else if(state==='ending'&&endingDone()&&!endP?.doorFrame)toTitle();else if(canPause())setPause(true);});

// スクロール・ズーム・長押しメニューを防止
document.addEventListener('touchmove',e=>{if(!arcade.open)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// アプリ切替時に入力をリセット
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);try{if(!document.hidden)unlockAudio()}catch(_){}keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;last=0;acc=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))});

// スタートボタン（click で開始：iPhoneの音もこの操作で鳴らせる）
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame()});

// 音楽ON/OFFボタン（設定は次回も保持）
const mb=document.getElementById('music');
function setMusic(on){musicOn=on;mb.textContent=on?'🎵':'🔇';mb.classList.toggle('off',!on);try{localStorage.setItem('skyhop-music',on?'on':'off')}catch(_){}if(bgmBus&&audioCtx)bgmBus.gain.setTargetAtTime(on?1:0,audioCtx.currentTime,.02)}
mb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMusic(!musicOn)});
setMusic(musicOn);

// あらかじめ用意したMP3とオリジナルBGMを切り替える。
const bgmSwitch=document.getElementById('bgmSwitch');
function updateBgmButton(){
  for(const b of bgmSwitch.querySelectorAll('button'))b.setAttribute('aria-pressed',String((b.dataset.bgm==='mp3')===mp3Enabled));
}
function setBgmMode(useMp3){
  unlockAudio();
  if(useMp3===mp3Enabled){updateBgmButton();return;}
  if(mp3Cur){mp3Halt(mp3Cur);mp3Cur=null}
  mp3Enabled=useMp3;
  curSong=null;bgmNext=0;bgmStep=0;
  if(mp3Enabled){
    setMusic(true);
    // 再生要求とAudioContextの復帰をクリック処理内で行い、iOSの操作制限に対応。
    unlockAudio();
    const key=mp3Key(currentSong());
    if(key&&!paused&&mode==='game'&&!document.hidden){
      const m=mp3Get(key);mp3Load(m);mp3Cur=key;m.started=true;
      if(m.engine==='el')mp3PlayEl(m);
    }
  }
  updateBgmButton();bgmTick();
}
bgmSwitch.addEventListener('pointerdown',e=>e.stopPropagation());
bgmSwitch.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button[data-bgm]');
  if(b)setBgmMode(b.dataset.bgm==='mp3');
});
updateBgmButton();

// 全画面ボタン（対応端末のみ：主にAndroid）
const fs=document.getElementById('fs'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){fs.style.display='block';fs.addEventListener('click',async()=>{try{await root.requestFullscreen();await screen.orientation?.lock?.('landscape')}catch(_){}});document.addEventListener('fullscreenchange',()=>fs.style.display=document.fullscreenElement?'none':'block')}
